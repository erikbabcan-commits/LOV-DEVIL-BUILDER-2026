# LOV-DEVIL full-stack na VPS: app (Hono API) + web (Caddy: static UI + /api proxy + auto SSL)
# Spustenie: cd deploy && cp .env.example .env && docker compose up -d --build
# Build kontext je repozitár root (..) — .dockerignore tam musí byť.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Secrets číta z koreňového .env (MISTRAL_API_KEY, GITHUB_*, ...)
    env_file:
      - ../.env
    environment:
      GITHUB_SESSION_DIR: /data/sessions
      # NODE_ENV nesmie byt production — guarda v server/index.ts (public deploy block)
    expose:
      - "8787"
    volumes:
      - session-data:/data/sessions

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  session-data:
  caddy-data:
  caddy-config:
